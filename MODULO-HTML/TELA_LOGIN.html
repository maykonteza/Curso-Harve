<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Entrar</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #fff;
            background: #000;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 15% 15%, rgba(220, 38, 38, 0.16), transparent 36%),
                radial-gradient(ellipse at 90% 85%, rgba(38, 183, 166, 0.08), transparent 32%),
                #000;
        }

        .login-card {
            width: min(100%, 440px);
            padding: 44px;
            border: 1px solid #333;
            border-radius: 20px;
            background: #000;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            margin-bottom: 28px;
            border-radius: 13px;
            color: #fff;
            background: #dc2626;
            font-size: 22px;
            font-weight: 750;
        }

        h1 {
            margin: 0;
            font-size: clamp(26px, 5vw, 32px);
            letter-spacing: -0.04em;
        }

        h2 {
            margin: 8px 0 0;
            font-size: 18px;
            letter-spacing: -0.02em;
        }

        .intro {
            margin: 9px 0 30px;
            color: #d0d5dd;
            font-size: 15px;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 19px;
        }

        [hidden] {
            display: none !important;
        }

        .field {
            display: grid;
            gap: 8px;
        }

        label {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 48px;
            padding: 0 14px;
            border: 1px solid #555;
            border-radius: 9px;
            outline: none;
            background: #171717;
            color: #fff;
            font: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #b3b3b3;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.14);
        }

        select {
            cursor: pointer;
        }

        textarea {
            min-height: 88px;
            padding: 12px 14px;
            resize: vertical;
        }

        .submit-button {
            min-height: 49px;
            margin-top: 5px;
            border: 0;
            border-radius: 9px;
            background: #dc2626;
            color: #fff;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
            transition: background 150ms ease, transform 150ms ease;
        }

        .submit-button:hover {
            background: #b91c1c;
        }

        .submit-button:active {
            transform: translateY(1px);
        }

        .signup {
            margin: 25px 0 0;
            color: #d0d5dd;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #b42318;
            font-weight: 650;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(220, 38, 38, 0.45);
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">M</div>
        <h1>Boas-vindas</h1>
        <p class="intro">Entre com seus dados para acessar sua conta.</p>

        <form id="login-form">
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email"
                    required>
            </div>

            <div class="field">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" placeholder="Digite sua senha"
                    autocomplete="current-password" required>
            </div>

            <button class="submit-button" type="submit">Entrar</button>
        </form>

        <form id="transaction-form" action="#" method="post" hidden>
            <h2 id="transaction-heading" tabindex="-1">Dados do lançamento</h2>
            <div class="field">
                <label for="transaction-type">Tipo</label>
                <select id="transaction-type" name="transactionType" required>
                    <option value="" disabled selected>Selecione entrada ou saída</option>
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>

            <div class="field">
                <label for="description">Descrição</label>
                <textarea id="description" name="description" placeholder="Descreva o lançamento"
                    autocomplete="off" required></textarea>
            </div>

            <div class="field">
                <label for="date">Data</label>
                <input id="date" name="date" type="date" required>
            </div>

            <div class="field">
                <label for="amount">Valor</label>
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0,00"
                    inputmode="decimal" required>
            </div>

            <button class="submit-button" type="submit">Salvar</button>
        </form>

        <p class="signup">Ainda não tem uma conta? <a href="criar-conta.html">Criar conta</a></p>
    </main>
    <script>
        const loginForm = document.getElementById("login-form");
        const transactionForm = document.getElementById("transaction-form");
        const transactionHeading = document.getElementById("transaction-heading");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();
            loginForm.hidden = true;
            transactionForm.hidden = false;
            transactionHeading.focus();
        });
    </script>
</body>

</html>
